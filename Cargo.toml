[package]
name = "bevy_retro_shaders"
version = "0.2.0"
edition = "2021"
authors = [ "Yudao" ]
description = "Retro post-processing shaders for Bevy - CRT effects, scanlines, and glitch effects"
license = "MIT"
repository = "https://github.com/kodaskills/bevy_retro_shaders"
keywords = [ "bevy", "graphics", "shader", "retro", "crt" ]
categories = [ "graphics", "game-development" ]


[dependencies]
rand = "0.10.1"
serde_json = "1"


[dependencies.bevy]
version = "0.19"
default-features = false


[dependencies.serde]
version = "1"
features = [ "derive" ]


[dependencies.bevy_egui]
version = "0.40.1"
optional = true


[dependencies.wasm-bindgen]
version = "0.2"
optional = true


[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true


[dependencies.js-sys]
version = "0.3"
optional = true


[dependencies.web-sys]
version = "0.3"
optional = true
features = [
"Window",
"Document",
"HtmlCanvasElement",
"Location",
"Worker",
"MessageEvent",
"OffscreenCanvas",
"DedicatedWorkerGlobalScope",
"MouseEvent",
"WorkerOptions",
"WorkerType",
"CustomEvent",
"CustomEventInit",
"console"
]


[dependencies.raw-window-handle]
version = "0.6"
optional = true


[dependencies.console_log]
version = "1.0"
optional = true


[dependencies.console_error_panic_hook]
version = "0.1"
optional = true


[target."cfg(target_arch = \"wasm32\")".dependencies]
serde-wasm-bindgen = "0.6"


[target."cfg(target_arch = \"wasm32\")".dependencies.getrandom]
version = "0.4"
features = [ "wasm_js" ]


[dev-dependencies.bevy]
version = "0.19"
features = [ "debug" ]


[features]
default = [ "crt", "jpeg", "native" ]
crt = [ ]
jpeg = [ "bevy/jpeg" ]
hot_reload = [ "bevy/file_watcher" ]
examples = [
"dep:bevy_egui",
"dep:wasm-bindgen",
"dep:wasm-bindgen-futures",
"dep:js-sys",
"dep:web-sys",
"dep:raw-window-handle",
"dep:console_log",
"dep:console_error_panic_hook"
]
web = [
"bevy/bevy_animation",
"bevy/bevy_camera",
"bevy/bevy_color",
"bevy/bevy_gizmos",
"bevy/bevy_image",
"bevy/bevy_mesh",
"bevy/bevy_shader",
"bevy/bevy_text",
"bevy/hdr",
"bevy/png",
"bevy/bevy_sprite",
"bevy/bevy_sprite_render",
"bevy/bevy_pbr",
"bevy/bevy_ui",
"bevy/bevy_ui_render",
"bevy/bevy_render",
"bevy/bevy_core_pipeline",
"bevy/bevy_post_process",
"bevy/bevy_gizmos_render",
"bevy/bevy_asset",
"bevy/bevy_winit",
"bevy/bevy_world_serialization",
"bevy/bevy_state",
"bevy/bevy_picking",
"bevy/default_font",
"bevy/tonemapping_luts",
"bevy/web",
"bevy/webgl2",
"bevy/zstd_rust"
]
native = [
"bevy/bevy_animation",
"bevy/bevy_camera",
"bevy/bevy_color",
"bevy/bevy_gizmos",
"bevy/bevy_image",
"bevy/bevy_mesh",
"bevy/bevy_shader",
"bevy/bevy_text",
"bevy/hdr",
"bevy/png",
"bevy/bevy_sprite",
"bevy/bevy_sprite_render",
"bevy/bevy_pbr",
"bevy/bevy_ui",
"bevy/bevy_ui_render",
"bevy/bevy_render",
"bevy/bevy_core_pipeline",
"bevy/bevy_post_process",
"bevy/bevy_gizmos_render",
"bevy/bevy_asset",
"bevy/bevy_winit",
"bevy/bevy_world_serialization",
"bevy/bevy_state",
"bevy/bevy_picking",
"bevy/default_font",
"bevy/tonemapping_luts",
"bevy/bevy_audio",
"bevy/bevy_gilrs",
"bevy/vorbis",
"bevy/x11",
"bevy/multi_threaded",
"bevy/zstd_rust"
]


[[example]]
name = "crt_example"
path = "examples/crt_example.rs"
required-features = [ "jpeg", "hot_reload", "examples" ]


[[example]]
name = "crt_3d_example"
path = "examples/crt_3d_example.rs"
required-features = [ "examples" ]


[[bin]]
name = "crt_example_web"
path = "examples/crt_example.rs"
required-features = [ "examples" ]


[[bin]]
name = "crt_3d_example_web"
path = "examples/crt_3d_example.rs"
required-features = [ "examples" ]


[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
